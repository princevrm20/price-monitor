services:
  - type: web
    name: price-monitor
    runtime: python
    plan: free
    autoDeploy: true
    repo: https://github.com/princevrm20/price-monitor
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn price_monitor.web:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PRICE_MONITOR_DESKTOP
        value: "0"
      - key: PRICE_MONITOR_DATA_DIR
        value: /tmp/pm_data
      - key: PRICE_MONITOR_AUTO_START
        value: "1"
      # Admin auth:
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Supabase (persistent database):
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Train tracking:
      - key: INDIAN_RAIL_API_KEY
        sync: false
      # Flight tracking (Amadeus):
      - key: AMADEUS_API_KEY
        sync: false
      - key: AMADEUS_API_SECRET
        sync: false
      # Notifications:
      - key: PRICE_MONITOR_NTFY_TOPIC
        sync: false
      - key: PRICE_MONITOR_TELEGRAM_BOT_TOKEN
        sync: false
      - key: PRICE_MONITOR_TELEGRAM_CHAT_ID
        sync: false
      # Email (optional):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TO
        sync: false
      # Digest:
      - key: DIGEST_INTERVAL_HOURS
        sync: false
