<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up - Price Monitor</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#4f46e5">
<style>
:root { --primary:#4f46e5; --primary-hover:#4338ca; --bg:#f1f5f9; --card:#fff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --danger:#dc2626; --green:#16a34a; --radius:12px; }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
.wrap { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:2.2rem 2rem; width:100%; max-width:420px; box-shadow:0 4px 24px rgba(0,0,0,.06); }
h1 { font-size:1.5rem; margin-bottom:.25rem; text-align:center; }
.subtitle { font-size:.85rem; color:var(--muted); margin-bottom:1.6rem; text-align:center; }
.err { background:#fef2f2; color:var(--danger); padding:.55rem .8rem; border-radius:8px; font-size:.84rem; margin-bottom:1rem; text-align:center; }
label { display:block; font-size:.85rem; font-weight:500; margin-bottom:.3rem; color:var(--text); }
input { width:100%; padding:.6rem .85rem; border:1px solid var(--border); border-radius:8px; font-size:.95rem; outline:none; transition:border-color .2s, box-shadow .2s; }
input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
.pw-wrap { position:relative; margin-bottom:.9rem; }
.pw-wrap input { padding-right:4.2rem; }
.pw-toggle { position:absolute; right:.55rem; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--muted); font-size:.82rem; line-height:1; user-select:none; -webkit-user-select:none; }
.pw-toggle:hover { color:var(--primary); }
.field { margin-bottom:.9rem; }
button[type="submit"] { width:100%; padding:.65rem; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .2s; margin-top:.3rem; }
button[type="submit"]:hover { background:var(--primary-hover); }
.footer { text-align:center; margin-top:1.3rem; font-size:.84rem; color:var(--muted); }
.footer a { color:var(--primary); text-decoration:none; font-weight:500; }
.footer a:hover { text-decoration:underline; }
.hint { font-size:.78rem; color:var(--muted); margin-top:.15rem; margin-bottom:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Create Account</h1>
  <p class="subtitle">Sign up to view price monitors</p>

  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <form method="POST">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" placeholder="Choose a username" autofocus required minlength="10" maxlength="30">
      <p class="hint">10–30 characters. Letters, numbers, underscores, and @ only.</p>
    </div>

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" name="password" id="password" placeholder="Choose a password" required minlength="8">
      <span class="pw-toggle" tabindex="-1" onclick="togglePw('password', this)">&#128065;</span>
    </div>
    <p class="hint" style="margin-top:-.5rem;">Minimum 8 characters.</p>

    <label for="confirm_password">Confirm Password</label>
    <div class="pw-wrap">
      <input type="password" name="confirm_password" id="confirm_password" placeholder="Re-enter your password" required>
      <span class="pw-toggle" tabindex="-1" onclick="togglePw('confirm_password', this)">&#128065;</span>
    </div>

    <button type="submit">Create Account</button>
  </form>

  <div class="footer">
    Already have an account? <a href="/login">Log in</a>
  </div>
</div>

<script>
function togglePw(id, el) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') {
    inp.type = 'text';
    el.innerHTML = '&#128064;';
  } else {
    inp.type = 'password';
    el.innerHTML = '&#128065;';
  }
}
</script>
</body>
</html>
